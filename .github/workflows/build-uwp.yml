name: build-uwp

on:
  workflow_dispatch:
    inputs:
      rotate_signing_certificate:
        description: Generate and export a new Windows-native signing certificate
        required: false
        default: false
        type: boolean
  push:
    branches:
      - uwp-9.2.3-rebase

permissions:
  actions: read
  contents: read

jobs:
  rotate-signing-certificate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rotate_signing_certificate }}
    runs-on: windows-2022
    steps:
      - name: Check out certificate sealing script
        uses: actions/checkout@v4

      - name: Generate and seal Windows-native certificate
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SEALED_ACTIONS_SECRET_OUTPUT: ${{ runner.temp }}/Ship-of-Harkinian-UWP-sealed-secret.json
          UWP_SIGNING_PFX_PASSWORD: ${{ secrets.UWP_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:UWP_SIGNING_PFX_PASSWORD) {
            throw "UWP_SIGNING_PFX_PASSWORD is required to rotate the signing certificate."
          }
          python -m pip install pynacl
          $pfxPath = Join-Path $env:RUNNER_TEMP "Ship-of-Harkinian-UWP.pfx"
          try {
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject "CN=odolwa" `
              -KeyUsage DigitalSignature `
              -FriendlyName "Ship of Harkinian UWP CI" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
            $securePassword = ConvertTo-SecureString $env:UWP_SIGNING_PFX_PASSWORD -AsPlainText -Force
            Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $securePassword | Out-Null
            python .github/scripts/seal-actions-secret.py $pfxPath
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $pfxPath
          }

      - name: Upload sealed signing secret
        uses: actions/upload-artifact@v4
        with:
          name: Ship-of-Harkinian-UWP-sealed-signing-secret
          if-no-files-found: error
          path: ${{ runner.temp }}/Ship-of-Harkinian-UWP-sealed-secret.json

  build-uwp:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rotate_signing_certificate) }}
    # The UWP project is a Visual Studio 2022 project. `windows-latest` moved to
    # Visual Studio 2026, whose CMake image no longer includes the VS 17
    # generator, so keep this build on the matching toolchain.
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Restore native dependencies and objects
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vcpkg
            build-windows
          key: ${{ runner.os }}-vs2022-soh-uwp-${{ hashFiles('CMakeLists.txt', 'CMake/**', 'soh/**', 'include/**', 'libultraship/**', 'patches/libultraship-uwp/**') }}

      - name: Apply Xbox libultraship patches
        shell: pwsh
        run: |
          Get-ChildItem patches/libultraship-uwp/*.patch |
            Sort-Object Name |
            ForEach-Object { git -C libultraship apply --whitespace=nowarn $_.FullName }

      - name: Download verified Shipwright 9.2.3 assets
        shell: pwsh
        run: |
          $url = "https://github.com/HarbourMasters/Shipwright/releases/download/9.2.3/SoH-Ackbar-Delta-Win64.zip"
          Invoke-WebRequest -Uri $url -OutFile upstream-win64.zip
          $actual = (Get-FileHash upstream-win64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "cc7bd5ada1332be50013976fc3db3289cacde1df57e7e6cf73d4a1df81313e30"
          if ($actual -ne $expected) {
            throw "Shipwright release checksum mismatch: $actual"
          }
          Expand-Archive upstream-win64.zip -DestinationPath upstream-win64
          New-Item -ItemType Directory -Force build-windows/soh | Out-Null
          Copy-Item upstream-win64/soh.o2r build-windows/soh/soh.o2r

      - name: Build Shipwright DLL
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          cmake -S . -B build-windows -G Ninja `
            -DCMAKE_MAKE_PROGRAM=ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_REMOTE_CONTROL=1
          cmake --build build-windows --config Release --parallel 10
          # The main project deliberately writes its DLL/import library to the
          # repository-level x64/Release directory. Stage those beside soh.o2r
          # so the standalone UWP wrapper has one complete dependency folder.
          Copy-Item x64/Release/soh.dll build-windows/soh/soh.dll
          Copy-Item x64/Release/soh.lib build-windows/soh/soh.lib

      - name: Save native dependencies and objects
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vcpkg
            build-windows
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Configure UWP package
        shell: pwsh
        run: |
          cmake -S uwp -B build-uwp -G "Visual Studio 17 2022" -A x64 `
            -DSOH_BUILD_DIR="${{ github.workspace }}/build-windows" `
            -DSOH_EXE_DIR="${{ github.workspace }}/build-windows/soh"

      - name: Build and sign MSIX bundle
        shell: pwsh
        env:
          UWP_SIGNING_PFX_BASE64: ${{ secrets.UWP_SIGNING_PFX_BASE64 }}
          UWP_SIGNING_PFX_PASSWORD: ${{ secrets.UWP_SIGNING_PFX_PASSWORD }}
        run: |
          if ($env:UWP_SIGNING_PFX_BASE64 -and $env:UWP_SIGNING_PFX_PASSWORD) {
            $pfxPath = Join-Path $env:RUNNER_TEMP "Ship-of-Harkinian-UWP.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:UWP_SIGNING_PFX_BASE64))
            $securePassword = ConvertTo-SecureString $env:UWP_SIGNING_PFX_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfxPath `
              -CertStoreLocation "Cert:\CurrentUser\My" -Password $securePassword
          } else {
            Write-Warning "Stable signing secrets are unavailable; generating a one-run development certificate."
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject "CN=odolwa" `
              -KeyUsage DigitalSignature `
              -FriendlyName "Ship of Harkinian UWP CI fallback" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          }
          msbuild build-uwp/soh-uwp.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms=x64 `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint=$($cert.Thumbprint)

      - name: Upload UWP package
        uses: actions/upload-artifact@v4
        with:
          name: Ship-of-Harkinian-UWP-x64
          if-no-files-found: error
          path: |
            build-uwp/AppPackages/**/*.msixbundle
            build-uwp/AppPackages/**/*.appxbundle
            build-uwp/AppPackages/**/*.msix
            build-uwp/AppPackages/**/*.appx
            build-uwp/AppPackages/**/*.cer
